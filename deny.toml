[graph]
targets = [
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
]
all-features = true

[advisories]
unmaintained = "workspace"
unsound = "all"
yanked = "deny"
ignore = []

[licenses]
confidence-threshold = 0.93
allow = [
    "Apache-2.0",
    "MIT",
    "Unicode-3.0",
]
unused-allowed-license = "deny"

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
deny = []
skip = [
    { crate = "syn@2.0.119", reason = "Windows support macros still require syn 2 while current application derives use syn 3" },
    { crate = "windows-link@0.1.3", reason = "Transitive windows 0.61 support and windows-sys 0.61 currently use separate windows-link lines" },
]
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = [
    "https://github.com/rust-lang/crates.io-index",
]
