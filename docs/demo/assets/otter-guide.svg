<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">ExecLocus original faceless river otter guide</title>
  <desc id="desc">A friendly faceless river otter pictogram with a compact round head, small ears, a long soft body, four rounded paws, and a thick tapered tail.</desc>
  <style>
    :root {
      --otter-fill: #0b1722;
      --otter-signal: #2dd4bf;
      --otter-background: #dffcf7;
    }
    .guide {
      transform-origin: 320px 174px;
      animation: float 4s cubic-bezier(.37, 0, .63, 1) infinite;
    }
    .silhouette { fill: var(--otter-fill); }
    .ring {
      fill: none;
      stroke: var(--otter-signal);
      stroke-width: 3;
      transform-origin: 320px 315px;
      animation: signal 2.4s ease-out infinite;
    }
    .marker {
      fill: var(--otter-signal);
      stroke: var(--otter-background);
      stroke-width: 3;
    }
    @keyframes float {
      0%, 100% { transform: translateY(3px) rotate(-1deg); }
      50% { transform: translateY(-6px) rotate(1deg); }
    }
    @keyframes signal {
      0% { transform: scale(.68); opacity: .8; }
      100% { transform: scale(1.75); opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .guide, .ring { animation: none; }
    }
  </style>
