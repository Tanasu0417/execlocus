<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-labelledby="title desc">
  <title id="title">ExecLocus original faceless otter guide</title>
  <desc id="desc">A calm faceless river otter silhouette with a low rounded body, short paws, and a broad tapered tail.</desc>
  <style>
    :root {
      --otter-fill: #b8f3e7;
      --otter-edge: #67d8c4;
      --otter-signal: #55b8ff;
    }
    .guide {
      transform-origin: 335px 160px;
      animation: drift 4.8s cubic-bezier(.45, 0, .55, 1) infinite;
    }
    .body-part { fill: var(--otter-fill); }
    .body-outline {
      fill: none;
      stroke: var(--otter-edge);
      stroke-width: 3;
      stroke-linecap: round;
      opacity: .65;
    }
    .tail {
      transform-origin: 490px 176px;
      animation: tail 4.8s cubic-bezier(.45, 0, .55, 1) infinite;
    }
    .paw { transform-origin: center; }
    .signal {
      fill: none;
      stroke: var(--otter-signal);
      stroke-width: 4;
      stroke-linecap: round;
      transform-origin: 332px 278px;
      animation: pulse 2.4s ease-out infinite;
    }
    .marker { fill: var(--otter-signal); }
    @keyframes drift {
      0%, 100% { transform: translateY(4px) rotate(-.8deg); }
      50% { transform: translateY(-5px) rotate(.8deg); }
    }
    @keyframes tail {
      0%, 100% { transform: rotate(1.6deg); }
      50% { transform: rotate(-2.4deg); }
    }
    @keyframes pulse {
      0% { transform: scale(.7); opacity: .9; }
      100% { transform: scale(1.6); opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .guide, .tail, .signal { animation: none; }
    }
  </style>
  <g class="guide">
    <g class="tail">
      <path class="body-part" d="M468 151 C528 150 558 172 592 193 C627 215 663 224 704 222 C666 248 612 247 564 229 C526 215 495 197 461 188 Z"/>
      <path class="body-outline" d="M468 151 C528 150 558 172 592 193 C627 215 663 224 704 222"/>
    </g>
    <ellipse class="body-part" cx="337" cy="158" rx="174" ry="76" transform="rotate(4 337 158)"/>
    <ellipse class="body-part" cx="202" cy="148" rx="76" ry="59" transform="rotate(-7 202 148)"/>
    <ellipse class="body-part" cx="137" cy="145" rx="65" ry="46" transform="rotate(-8 137 145)"/>
    <ellipse class="body-part" cx="77" cy="151" rx="47" ry="26" transform="rotate(-5 77 151)"/>
    <circle class="body-part" cx="154" cy="103" r="12"/>
    <rect class="body-part paw" x="181" y="203" width="64" height="30" rx="15" transform="rotate(-11 213 218)"/>
    <rect class="body-part paw" x="246" y="213" width="59" height="29" rx="14" transform="rotate(8 275 228)"/>
    <rect class="body-part paw" x="387" y="208" width="63" height="30" rx="15" transform="rotate(-5 418 223)"/>
    <rect class="body-part paw" x="438" y="196" width="58" height="29" rx="14" transform="rotate(13 467 211)"/>
    <path class="body-outline" d="M31 151 C45 131 72 126 100 130 C118 105 137 97 160 99 C173 87 191 82 212 86 C250 76 298 77 345 86 C409 98 452 121 474 152"/>
    <circle class="signal" cx="332" cy="278" r="17"/>
    <rect class="marker" x="325" y="271" width="14" height="14" rx="3" transform="rotate(45 332 278)"/>
  </g>
</svg>
