<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" role="img" aria-labelledby="title desc">
  <title id="title">ExecLocus original faceless river otter guide</title>
  <desc id="desc">An original side-view river otter silhouette with a small head, low neck, rounded back, short legs, and a long tapered tail.</desc>
  <style>
    :root {
      --otter-fill: #b8f3e7;
      --otter-edge: #67d8c4;
      --otter-signal: #55b8ff;
    }
    .guide {
      transform-origin: 320px 168px;
      animation: breathe 4.8s cubic-bezier(.45, 0, .55, 1) infinite;
    }
    .silhouette { fill: var(--otter-fill); }
    .outline {
      fill: none;
      stroke: var(--otter-edge);
      stroke-width: 3;
      stroke-linecap: round;
      opacity: .72;
    }
    .signal {
      fill: none;
      stroke: var(--otter-signal);
      stroke-width: 4;
      stroke-linecap: round;
      transform-origin: 306px 282px;
      animation: pulse 2.4s ease-out infinite;
    }
    .marker { fill: var(--otter-signal); }
    @keyframes breathe {
      0%, 100% { transform: translateY(3px) rotate(-.4deg); }
      50% { transform: translateY(-4px) rotate(.5deg); }
    }
    @keyframes pulse {
      0% { transform: scale(.7); opacity: .9; }
      100% { transform: scale(1.6); opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .guide, .signal { animation: none; }
    }
  </style>
  <g class="guide">
    <path class="silhouette" d="M28 130
      C38 116 54 108 75 107
      C88 97 104 94 119 98
      C130 100 138 105 145 113
      C158 127 172 139 190 149
      C204 157 219 161 235 161
      C266 149 297 127 334 112
      C374 96 418 98 452 114
      C483 129 500 154 508 185
      C515 210 525 228 543 241
      C567 258 598 272 628 286
      C595 284 561 279 526 270
      C493 261 462 249 434 233
      C420 225 407 216 396 205
      C387 220 376 234 362 243
      C351 251 338 253 328 248
      C319 244 315 237 319 230
      C324 222 335 218 344 209
      C326 204 307 202 289 205
      C267 208 249 218 232 228
      C216 238 200 241 188 237
      C179 234 175 226 180 219
      C186 211 199 207 207 198
      C214 189 211 179 201 169
      C189 158 173 152 156 144
      C139 136 125 125 108 120
      C88 113 67 115 51 122
      C40 127 33 133 28 130 Z"/>
    <circle class="silhouette" cx="124" cy="98" r="9"/>
    <path class="outline" d="M28 130 C38 116 54 108 75 107 C88 97 104 94 119 98 C130 100 138 105 145 113 C158 127 172 139 190 149 C204 157 219 161 235 161 C266 149 297 127 334 112 C374 96 418 98 452 114 C483 129 500 154 508 185 C515 210 525 228 543 241 C567 258 598 272 628 286"/>
    <circle class="signal" cx="306" cy="282" r="17"/>
    <rect class="marker" x="299" y="275" width="14" height="14" rx="3" transform="rotate(45 306 282)"/>
  </g>
</svg>
