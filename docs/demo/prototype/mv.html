<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>ExecLocus 60秒コンセプト映像</title>
  <link rel="stylesheet" href="mv.css">
</head>
<body>
  <main>
    <section class="master" aria-label="ExecLocus 60秒コンセプトMV">
      <iframe id="demo-frame" title="ExecLocus interactive concept screen" src="index.html?view=inspect" tabindex="-1"></iframe>
      <div class="scrim" aria-hidden="true"></div>
      <header class="mv-header">
        <span id="mv-length">ExecLocus / 60秒</span>
        <span id="mv-gate" class="gate">コンセプト映像 · 合成データ</span>
      </header>
      <div class="chapter"><span id="frame-number">01</span><span id="frame-kicker">THE QUESTION</span></div>
      <div class="caption-panel">
        <p id="caption">同じプロジェクト。選ばれるNodeも同じ？</p>
        <div class="wave" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
      </div>
      <div class="timeline"><span id="progress"></span></div>
      <time id="timecode">00:00 / 01:00</time>
    </section>
    <nav class="controls" aria-label="再生操作">
      <button id="play">再生</button>
      <button id="pause">一時停止</button>
      <button id="reset">最初へ</button>
      <button id="mv-language-toggle" type="button" aria-label="Switch to English">EN</button>
      <label><span id="frame-label">場面</span> <select id="scene-select"></select></label>
      <span id="mv-note">音声なしでも意味が通る字幕版です。</span>
    </nav>
  </main>
  <script src="mv.js"></script>
</body>
</html>
