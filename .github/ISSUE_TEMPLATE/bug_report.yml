name: Bug report
description: Report a reproducible ExecLocus defect
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve ExecLocus. Remove usernames, machine names,
        personal paths, tokens, and other private data before submitting output.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: dropdown
    id: runtime
    attributes:
      label: Runtime
      options:
        - Windows
        - WSL
        - Linux
        - Mixed or unknown
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Provide the smallest sequence that reproduces the issue.
    validations:
      required: true
  - type: textarea
    id: sanitized_output
    attributes:
      label: Sanitized output
      description: Paste only output you have reviewed and redacted.
      render: shell
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed credentials, personal paths, and identifying information.
          required: true
