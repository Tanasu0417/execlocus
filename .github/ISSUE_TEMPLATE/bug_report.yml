name: Bug report
description: Report a reproducible ExecLocus defect
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve ExecLocus. Remove usernames, machine names,
        personal paths, tokens, and other private data. Until automatic redaction
        exists, do not paste raw ExecLocus or environment output.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: dropdown
    id: runtime
    attributes:
      label: Runtime
      options:
        - Windows
        - WSL
        - Linux
        - Mixed or unknown
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Provide the smallest sequence using synthetic names and paths. Do not paste raw diagnostics.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I did not include raw diagnostics, credentials, personal paths, or identifying information.
          required: true
