[package]
name = "execlocus"
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Evidence-backed runtime topology for AI coding agents across Windows and WSL"
readme = "README.md"
repository = "https://github.com/Tanasu0417/execlocus"
homepage = "https://github.com/Tanasu0417/execlocus"
keywords = ["wsl", "windows", "cli", "diagnostics", "ai-agents"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
